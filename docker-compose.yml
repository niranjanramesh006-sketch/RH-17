version: "3.8"
services:
  postgres:
    image: postgres:15
    container_name: omniassist_db
    environment:
      POSTGRES_USER: omniassist
      POSTGRES_PASSWORD: omniassist123
      POSTGRES_DB: omniassist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: omniassist_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: